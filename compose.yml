services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: pi-harness-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./infra/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - pi-harness-searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-pi-harness-local-searxng-change-me}
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: pi-harness-searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - pi-harness-searxng-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pi-harness-searxng-cache:
  pi-harness-searxng-valkey:
